<style>
/* Layout: a QA log - summary and locale heat grid on top, then one section per page with its issues as rows, UAT and live side by side. */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunk: #e9ecf1; --fg: #161a22; --muted: #5a6273; --line: #d8dce4;
  --accent: #1f4fd1; --accent-soft: #e4ebfc; --uat: #b4361f; --live: #17734a;
  --heat0: #eef1f5; --heat1: #fbe3cf; --heat2: #f6b98a; --heat3: #e9844a; --heat4: #c4521f; --heat-ink: #3b1606;
  --font-ui: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --surface: #1a1e26; --sunk: #232833; --fg: #e7eaf0; --muted: #9aa2b2; --line: #2f3542;
  --accent: #86a3ff; --accent-soft: #233056; --uat: #ff8a73; --live: #5cc993;
  --heat0: #20252f; --heat1: #4a2c1c; --heat2: #7a3f1f; --heat3: #b05524; --heat4: #e0713a; --heat-ink: #fff1e8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --sunk: #232833; --fg: #e7eaf0; --muted: #9aa2b2; --line: #2f3542;
  --accent: #86a3ff; --accent-soft: #233056; --uat: #ff8a73; --live: #5cc993;
  --heat0: #20252f; --heat1: #4a2c1c; --heat2: #7a3f1f; --heat3: #b05524; --heat4: #e0713a; --heat-ink: #fff1e8; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-ui); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.wrap > *, #pages > * { min-width: 0; }
.panel, .page, #pages, .wrap > section { grid-template-columns: minmax(0, 1fr); }
.toolbar select { flex: 1 1 140px; min-width: 0; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); overflow-wrap: anywhere; }
.lede { color: var(--muted); max-width: 72ch; margin-top: 8px; }
.eyebrow { font: 500 11.5px var(--font-data); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 32px; margin-top: 18px; }
.stat b { display: block; font: 500 28px var(--font-data); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.scroll { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 3px; font: 12.5px var(--font-data); font-variant-numeric: tabular-nums; }
.heat th { font-weight: 500; color: var(--muted); padding: 2px 4px; text-align: center; }
.heat th.row { text-align: left; font-family: var(--font-ui); font-size: 13.5px; color: var(--fg); white-space: nowrap; padding-right: 10px; }
.heat th.row button { all: unset; cursor: pointer; } .heat th.row button:hover { color: var(--accent); }
.heat td { width: 38px; height: 30px; text-align: center; border-radius: 4px; background: var(--heat0); color: var(--muted); }
.heat td.h1 { background: var(--heat1); color: var(--heat-ink); } .heat td.h2 { background: var(--heat2); color: var(--heat-ink); }
.heat td.h3 { background: var(--heat3); color: var(--heat-ink); } .heat td.h4 { background: var(--heat4); color: #fff; font-weight: 500; }
.heat td.na { background: transparent; border: 1px dashed var(--line); }
.heat td.tot { background: transparent; color: var(--fg); font-weight: 500; }
.note { color: var(--muted); font-size: 13.5px; max-width: 80ch; }
.shared { display: grid; gap: 0; }
.shared .row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: baseline; }
.shared .row:first-child { border-top: 0; }
.count { font: 500 20px var(--font-data); font-variant-numeric: tabular-nums; }
.count small { display: block; font: 11px var(--font-ui); color: var(--muted); }
.refs { font: 12px var(--font-data); color: var(--muted); }
.refs button { all: unset; cursor: pointer; color: var(--accent); }
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
select, input[type=search] { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; max-width: 100%; }
input[type=search] { flex: 1 1 200px; }
.multi { position: relative; flex: 1 1 140px; min-width: 0; }
.multi summary { list-style: none; cursor: pointer; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 28px 7px 10px; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.multi summary::-webkit-details-marker { display: none; }
.multi summary::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.multi[open] summary { border-color: var(--accent); }
.multi .menu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; min-width: max(100%, 240px); max-height: min(60vh, 420px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 6px; }
.multi .acts { display: flex; gap: 6px; padding: 2px 2px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.multi .acts button { font: inherit; font-size: 13px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.multi label { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.multi label:hover { background: var(--sunk); }
.multi label input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.multi label small { margin-left: auto; color: var(--muted); font: 12px var(--font-data); }
.toolbar .shown { color: var(--muted); font-size: 13px; margin-left: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.page { display: grid; gap: 4px; scroll-margin-top: 70px; }
.page-head { display: grid; gap: 6px; padding-bottom: 10px; }
.urls { display: grid; gap: 2px; font: 12.5px var(--font-data); color: var(--muted); }
.urls .u { color: var(--uat); } .urls .l { color: var(--live); }
.issue { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 18px 0; border-top: 1px solid var(--line); }
.num { font: 500 15px var(--font-data); color: var(--muted); }
.issue .body { display: grid; gap: 8px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.kind { font: 500 11px var(--font-data); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--sunk); color: var(--fg); }
.kind.Locale { background: var(--heat1); color: var(--heat-ink); }
.vals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 18px; font-size: 13.5px; }
.vals div { min-width: 0; overflow-wrap: anywhere; }
.vals .k { font: 500 11px var(--font-data); letter-spacing: .06em; text-transform: uppercase; display: block; }
.vals .k.u { color: var(--uat); } .vals .k.l { color: var(--live); }
.langs { display: flex; flex-wrap: wrap; gap: 4px; }
.lang { font: 500 11.5px var(--font-data); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.lang.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); text-decoration: none; cursor: pointer; }
a.lang.on:hover, a.lang.on:focus-visible { background: var(--accent); color: var(--surface); outline: none; }
.lang.off { opacity: .4; cursor: not-allowed; background: transparent; border-style: dashed; }
.cause { font-size: 13.5px; color: var(--muted); }
.also { font-size: 12.5px; color: var(--muted); }
.also button { all: unset; cursor: pointer; color: var(--accent); }
.shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 4px; }
.shots figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
.shots figcaption { font: 500 11px var(--font-data); letter-spacing: .06em; text-transform: uppercase; }
.shots img { width: 100%; max-height: 360px; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: var(--sunk); }
.noshot { font-size: 13px; color: var(--muted); }
details { font-size: 14px; } details > summary { cursor: pointer; font-weight: 600; padding-block: 6px; }
details ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); }
.empty { color: var(--muted); padding: 24px 0; }
.lightbox { position: fixed; inset: 0; background: rgba(8, 10, 16, .9); display: none; place-items: center; z-index: 20; cursor: zoom-out; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox.open { display: grid; }
.lightbox img { max-width: 100%; }
footer { color: var(--muted); font-size: 13px; }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">UAT vs live QA log</span>
    <h1 id="heading"></h1>
    <p class="lede" id="intro"></p>
    <div class="stats" id="stats"></div>

  <section class="panel" aria-labelledby="hHeat">

    <div class="scroll"><table class="heat" id="heat"></table></div>
    <p class="note" id="heatNote"></p>

  </section>

  <section class="panel" aria-labelledby="hShared" id="sharedPanel">
    <h2 id="hShared">Seen on several pages</h2>
    <p class="note">The same fault on more than one page. Fixing it once should clear every page listed.</p>
    <div class="shared" id="shared"></div>
  </section>

  <section aria-labelledby="hAll" style="display:grid;gap:18px">
    <h2 id="hAll">All issues</h2>
    <div class="toolbar">
      <select id="fPage" aria-label="Page"></select>
      <select id="fLang" aria-label="Locale"></select>
      <details class="multi" id="kindDD"><summary id="kindSum" aria-label="Issue type">All types</summary>
        <div class="menu"><div class="acts"><button type="button" id="kAll">Select all</button><button type="button" id="kNone">Unselect all</button></div><div id="kList"></div></div></details>
      <input type="search" id="fText" placeholder="Search issues" aria-label="Search issues">
      <span class="shown" id="shown"></span>
    </div>
    <div id="pages" style="display:grid;gap:34px"></div>
  </section>
  <footer id="foot"></footer>
</div>

ases-frictionless-experience", 11], ["platform-one-use-cases-seamless-it-operations", 16]]}, {"title": "Vertical spacing between sections is collapsed", "kind": "Spacing", "refs": [["platform-one-use-cases-frictionless-experience", 12], ["platform-one-use-cases-seamless-it-operations", 14]]}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const codes = D.locales.map((l) => l[0]), names = Object.fromEntries(D.locales);
const bySlug = Object.fromEntries(D.pages.map((p) => [p.slug, p]));

$("#heading").textContent = D.heading;
$("#intro").textContent = D.intro;
const all = D.pages.flatMap((p) => p.issues);
const langsHit = new Set(all.flatMap((i) => i.langs));
const kindsAll = [...new Set(all.map((i) => i.kind))].sort();
const selKinds = new Set(kindsAll);
const kindOn = (i) => selKinds.has(i.kind);
const kindsFiltered = () => selKinds.size !== kindsAll.length;
const issueOf = (s, id) => bySlug[s].issues.find((x) => x.id === id);
const cls = (n) => n === 0 ? "" : n === 1 ? "h1" : n <= 3 ? "h2" : n <= 6 ? "h3" : "h4";

function renderSummary() {
  const kf = kindsFiltered();
  const pg = D.pages.map((p) => ({ p, is: p.issues.filter(kindOn) })).filter((x) => !kf || x.is.length);
  const vis = pg.flatMap((x) => x.is);
  const lh = new Set(vis.flatMap((i) => i.langs));
  const refsOf = (g) => g.refs.filter(([s, id]) => { const i = issueOf(s, id); return i && kindOn(i); });
  const sh = D.shared.map((g) => ({ g, refs: refsOf(g) })).filter((x) => x.refs.length);
  $("#stats").innerHTML = [[vis.length, "issues"], [pg.length, "pages"], [lh.size + " / 17", "locales affected"], [sh.length, "on several pages"]]
    .map(([n, t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join("");
  let h = `<thead><tr><th></th>${codes.map((c) => `<th title="${esc(names[c])}">${c}</th>`).join("")}<th>All</th></tr></thead><tbody>`;
  for (const { p, is } of pg) {
    h += `<tr><th class="row"><button data-go="${esc(p.slug)}">${esc(p.label)}</button></th>`;
    for (const c of codes) {
      if (!p.checked.includes(c)) { h += `<td class="na" title="${esc(names[c])}: not checked"></td>`; continue; }
      const n = is.filter((i) => i.langs.includes(c)).length;
      h += `<td class="${cls(n)}" title="${esc(p.label)}, ${esc(names[c])}: ${n} issue${n === 1 ? "" : "s"}">${n || "·"}</td>`;
    }
    h += `<td class="tot">${is.length}</td></tr>`;
  }
  $("#heat").innerHTML = h + "</tbody>";
  $("#sharedPanel").hidden = !sh.length;
  $("#shared").innerHTML = sh.map(({ g, refs }) => {
    const pages = [...new Set(refs.map((r) => r[0]))];
    return `<div class="row"><div class="count">${pages.length}<small>pages</small></div>
    <div style="min-width:0;display:grid;gap:4px"><h3>${esc(g.title)}</h3>
      <div class="refs">${refs.map(([s, id]) => `<button data-go="${esc(s)}" data-id="${id}">${esc(bySlug[s].label)} #${id}</button>`).join(" · ")}</div></div>
    <span class="kind">${esc(g.kind)}</span></div>`;
  }).join("");
}
if (D.heat_note) $("#heatNote").textContent = D.heat_note; else $("#heatNote").hidden = true;

// issue-type multi-select
const kCount = Object.fromEntries(kindsAll.map((k) => [k, all.filter((i) => i.kind === k).length]));
$("#kList").innerHTML = kindsAll.map((k) => `<label><input type="checkbox" value="${esc(k)}" checked>${esc(k)}<small>${kCount[k]}</small></label>`).join("");
function syncKinds() {
  for (const cb of document.querySelectorAll("#kList input")) cb.checked = selKinds.has(cb.value);
  $("#kindSum").textContent = selKinds.size === kindsAll.length ? "All types" : selKinds.size === 0 ? "No types selected" : selKinds.size === 1 ? [...selKinds][0] : `${selKinds.size} types selected`;
}
function setKinds(on) { selKinds.clear(); if (on) kindsAll.forEach((k) => selKinds.add(k)); syncKinds(); }
$("#kList").onchange = (e) => { e.target.checked ? selKinds.add(e.target.value) : selKinds.delete(e.target.value); syncKinds(); render(); };
$("#kAll").onclick = () => { setKinds(true); render(); };
$("#kNone").onclick = () => { setKinds(false); render(); };
document.addEventListener("click", (e) => { const dd = $("#kindDD"); if (dd.open && !dd.contains(e.target)) dd.open = false; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#kindDD").open = false; });

// filters
const opt = (v, t) => `<option value="${esc(v)}">${esc(t)}</option>`;
$("#fPage").innerHTML = opt("", "All pages") + D.pages.map((p) => opt(p.slug, p.label)).join("");
$("#fLang").innerHTML = opt("", "All locales") + D.locales.filter(([c]) => langsHit.has(c)).map(([c, n]) => opt(c, `${c} · ${n}`)).join("");
try { const s = JSON.parse(localStorage.getItem("qa-filters") || "{}"); for (const k of ["fPage", "fLang"]) if (s[k] && [...$("#" + k).options].some((o) => o.value === s[k])) $("#" + k).value = s[k]; if (Array.isArray(s.kinds)) { selKinds.clear(); s.kinds.forEach((k) => kindsAll.includes(k) && selKinds.add(k)); } } catch (e) {}
syncKinds();

const SEG = { CN: "cn", TW: "tw" };
const localeUrl = (url, c) => url.replace(/^(https?:\/\/[^/]+)\/[a-z]{2}(?=\/|$)/i, `$1/${SEG[c] || c.toLowerCase()}`);
function issueHtml(p, i) {
  const shot = (side, label) => i.shots[side] ? `<figure><figcaption style="color:var(--${side})">${label}</figcaption><img loading="lazy" src="${esc(i.shots[side])}" alt="${label} screenshot for issue ${i.id}"></figure>` : "";
  const shots = shot("uat", "UAT") + shot("live", "Live");
  return `<article class="issue" id="${esc(p.slug)}-${i.id}"><span class="num">#${i.id}</span><div class="body">
    <div class="meta"><span class="kind ${esc(i.kind)}">${esc(i.kind)}</span><span>${esc(i.component)}</span></div>
    <h3>${esc(i.issue)}</h3>
    <div class="vals"><div><span class="k u">UAT</span>${esc(i.uat)}</div><div><span class="k l">Live</span>${esc(i.live)}</div></div>
    <div class="langs">${codes.filter((c) => p.checked.includes(c)).map((c) => i.langs.includes(c)
      ? `<a class="lang on" href="${esc(localeUrl(p.uat, c))}" target="_blank" rel="noopener" title="${esc(names[c])}: open UAT page">${c}</a>`
      : `<span class="lang off" aria-disabled="true" title="${esc(names[c])}: no issue">${c}</span>`).join("")}</div>
    ${i.cause ? `<p class="cause">Likely cause: ${esc(i.cause)}</p>` : ""}
    ${i.also.length ? `<p class="also">Also on ${i.also.map((s) => `<button data-go="${esc(s)}">${esc(bySlug[s].label)}</button>`).join(", ")}</p>` : ""}
    ${shots ? `<div class="shots">${shots}</div>` : `<p class="noshot">No screenshot for this issue.</p>`}
  </div></article>`;
}
function render() {
  const fp = $("#fPage").value, fl = $("#fLang").value, ft = $("#fText").value.trim().toLowerCase();
  try { localStorage.setItem("qa-filters", JSON.stringify({ fPage: fp, fLang: fl, kinds: [...selKinds] })); } catch (e) {}
  let shown = 0, out = "";
  for (const p of D.pages) {
    if (fp && p.slug !== fp) continue;
    const list = p.issues.filter((i) => (!fl || i.langs.includes(fl)) && kindOn(i)
      && (!ft || [i.issue, i.component, i.uat, i.live, i.cause].join(" ").toLowerCase().includes(ft)));
    shown += list.length;
    if (!list.length && (fl || ft || kindsFiltered())) continue;
    out += `<section class="page" id="${esc(p.slug)}"><div class="page-head"><span class="eyebrow">${p.issues.length} issue${p.issues.length === 1 ? "" : "s"} · ${p.checked.length} locale${p.checked.length === 1 ? "" : "s"} checked${p.updated ? " · " + esc(p.updated) : ""}</span>
      <h2>${esc(p.label)}</h2>${p.label !== p.title ? `<p class="note">${esc(p.title)}</p>` : ""}
      <div class="urls"><span><span class="u">UAT</span> <a href="${esc(p.uat)}" target="_blank" rel="noopener">${esc(p.uat)}</a></span><span><span class="l">Live</span> <a href="${esc(p.live)}" target="_blank" rel="noopener">${esc(p.live)}</a></span></div></div>
      ${list.map((i) => issueHtml(p, i)).join("") || `<p class="empty">No issues found on this page.</p>`}
      ${p.not_issues.length ? `<details><summary>Possibly not an issue (${p.not_issues.length})</summary><ul>${p.not_issues.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
      ${p.couldnt_check.length ? `<details><summary>Couldn't check (${p.couldnt_check.length})</summary><ul>${p.couldnt_check.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    </section>`;
  }
  $("#pages").innerHTML = out || `<p class="empty">No issues match these filters.</p>`;
  renderSummary();
  $("#shown").textContent = `${shown} of ${all.length} issues`;
}
for (const id of ["fPage", "fLang"]) $("#" + id).onchange = render;
$("#fText").oninput = render;
render();

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) {
    $("#fPage").value = ""; $("#fLang").value = ""; setKinds(true); $("#fText").value = ""; render();
    const el = document.getElementById(go.dataset.id ? `${go.dataset.go}-${go.dataset.id}` : go.dataset.go);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  const img = e.target.closest(".shots img");
  if (img) { $("#lightbox img").src = img.src; $("#lightbox img").alt = img.alt; $("#lightbox").classList.add("open"); return; }
  if (e.target.closest("#lightbox")) $("#lightbox").classList.remove("open");
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#lightbox").classList.remove("open"); });
$("#foot").textContent = `Built ${D.built} from the UAT vs live comparison reports.`;
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>

</body></html>
